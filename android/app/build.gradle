plugins { id 'com.android.application' }

def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.rtanimate.doodlecalendar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rtanimate.doodlecalendar'
        minSdk 24
        targetSdk 34
        // CI passes the run number so every build installs as an update
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // A fixed key so each new APK installs over the previous one.
        release {
            storeFile file('doodle.keystore')
            storePassword 'doodlecal'
            keyAlias 'doodle'
            keyPassword 'doodlecal'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/webassets"] }
    }
}

// The Android app bundles the exact same web app from /web
tasks.register('copyWebApp', Copy) {
    from "$rootDir/../web"
    into "$buildDir/generated/webassets/www"
    exclude 'sw.js'
}
preBuild.dependsOn 'copyWebApp'

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
