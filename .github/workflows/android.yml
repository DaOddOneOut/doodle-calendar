name: Build Android app
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk DoodleCalendar.apk
      - uses: actions/upload-artifact@v4
        with: { name: DoodleCalendar-apk, path: DoodleCalendar.apk }
      - name: Publish to the "Android app" release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest build)
          body: |
            Latest Android build of Doodle Calendar (build ${{ github.run_number }}).
            On your phone, download **DoodleCalendar.apk** below and open it to install or update.
          files: DoodleCalendar.apk
          make_latest: true
